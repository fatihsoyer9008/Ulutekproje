name: ulutekproje-api
region: fra
services:
  - name: receipt-parser-api
    github:
      repo: fatihsoyer9008/Ulutekproje
      branch: main
      deploy_on_push: true
    source_dir: backend
    environment_slug: python
    build_command: pip install -r requirements.txt
    run_command: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    http_port: 8080
    health_check:
      http_path: /health
    envs:
      - key: APP_ENV
        value: production
        scope: RUN_TIME
      - key: USE_DUMMY_PARSER
        value: "true"
        scope: RUN_TIME
      - key: RECEIPT_IMAGE_UPLOAD_ENABLED
        value: "false"
        scope: RUN_TIME
      - key: RECEIPT_IMAGE_MAX_BYTES
        value: "10485760"
        scope: RUN_TIME
      - key: RECEIPT_IMAGE_MAX_PIXELS
        value: "25000000"
        scope: RUN_TIME
      - key: TRUST_PROXY_HEADERS
        value: "true"
        scope: RUN_TIME
      - key: TRUSTED_CLIENT_IP_HEADER
        value: do-connecting-ip
        scope: RUN_TIME
      - key: TRUSTED_PROXY_CIDRS
        value: 10.0.0.0/8
        scope: RUN_TIME
